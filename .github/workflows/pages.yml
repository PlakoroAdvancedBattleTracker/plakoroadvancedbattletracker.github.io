name: Publish Plakoro Advanced Battle Tracker
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Verify and build the complete tracker
        run: python3 build-site.py
      - uses: actions/cache@v4
        with:
          path: .card-refresh-cache
          key: published-card-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: published-card-cache-
      - name: Refresh the original public Drive cards
        run: python3 refresh-drive.py _site
      - name: Refresh modern cards and prepare the latest website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node refresh-cards.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
